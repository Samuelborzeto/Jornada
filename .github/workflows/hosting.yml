name: Publicar no Firebase Hosting
# Publica o app em https://jornada-diaria-5eaf2.web.app
# Roda sozinho a cada envio para a branch main (e também à mão, em Actions > Run workflow).
on:
  push:
    branches: [main]
    paths-ignore: ['push.js', '.github/workflows/lembretes.yml', '**.md']
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: jornada-diaria-5eaf2
          channelId: live
