name: Publicar no Firebase Hosting
# Publica o app em https://jornada-diaria-5eaf2.web.app
# Por enquanto só roda quando acionado à mão (aba Actions > Publicar no Firebase Hosting > Run workflow).
on:
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: jornada-diaria-5eaf2
          channelId: live
